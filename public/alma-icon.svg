<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="alma-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:0.6" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Top center -->
  <ellipse cx="32" cy="10" rx="10" ry="5" fill="url(#alma-grad)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Left upper -->
  <ellipse cx="13" cy="16" rx="8" ry="6" fill="url(#alma-grad)" filter="url(#glow)" opacity="0.85"/>
  
  <!-- Right upper -->
  <ellipse cx="51" cy="16" rx="8" ry="6" fill="url(#alma-grad)" filter="url(#glow)" opacity="0.85"/>
  
  <!-- Left middle -->
  <ellipse cx="10" cy="32" rx="6" ry="10" fill="url(#alma-grad)" filter="url(#glow)" opacity="0.8"/>
  
  <!-- Center -->
  <ellipse cx="32" cy="32" rx="12" ry="8" fill="url(#alma-grad)" filter="url(#glow)" opacity="0.95"/>
  
  <!-- Right middle -->
  <ellipse cx="54" cy="32" rx="6" ry="10" fill="url(#alma-grad)" filter="url(#glow)" opacity="0.8"/>
  
  <!-- Left lower -->
  <ellipse cx="16" cy="48" rx="9" ry="6" fill="url(#alma-grad)" filter="url(#glow)" opacity="0.85"/>
  
  <!-- Center lower -->
  <ellipse cx="32" cy="51" rx="10" ry="8" fill="url(#alma-grad)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Right lower -->
  <ellipse cx="48" cy="48" rx="9" ry="6" fill="url(#alma-grad)" filter="url(#glow)" opacity="0.85"/>
</svg>
